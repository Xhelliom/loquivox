[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loquivox"
version = "2.0.0"
description = "A Voice-Assistant & AI Companion for Linux"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Dianjeol" },
]

dependencies = [
    "sounddevice",
    "numpy<2",
    "scipy",
    "groq",
    "evdev",
    "pygobject",
    "pycairo",
    "tomlkit",
]

[project.optional-dependencies]
# Local offline transcription uses the standalone whisper.cpp `whisper-cli`
# binary (bundled by the packaging recipes), not a Python binding — so it
# needs no optional Python dependency here.
# Streaming live transcription backends.
# 3.13 is the first release with `client.live` (the gpt-live-1 talk engine);
# the streaming transcription backend and the realtime engine need only 2.x.
openai = ["openai>=3.13"]
deepgram = ["deepgram-sdk>=7"]
# MCP client (services/mcp_tools.py): the tools of any MCP server, spoken.
mcp = ["mcp>=2; python_version >= '3.11'"]
# Semantic end-of-turn detection for talk mode (Smart Turn v3, ~8 MB ONNX
# fetched on first use). Without it, talk mode ends turns on silence alone.
turn = ["onnxruntime>=1.17"]
# Local wake word for the companion mode (presence listener). Without it only
# the hotkey starts a session.
# openwakeword itself requires tflite-runtime, which has no wheel from 3.12 on: there
# the extra installs its real dependencies and Settings → Companion adds the
# package with --no-deps (ONNX engine only).
wake = [
    "onnxruntime>=1.17", "scipy>=1.3", "scikit-learn>=1", "tqdm>=4", "requests>=2",
    "openwakeword>=0.6; python_version < '3.12'",
]
# Local offline text-to-speech (Piper). Voices are ~60 MB ONNX files fetched on
# first use into ~/.cache/loquivox/piper. Without it, replies are spoken by the
# configured cloud engine.
tts = ["piper-tts>=1.2"]

[project.scripts]
loquivox = "loquivox.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loquivox = ["assets/*.svg"]
